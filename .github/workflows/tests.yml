name: Tests

# Reusable test suite. Called by ci.yml (pushes and pull requests) and by
# publish.yml (tag pushes) so that a release is gated on exactly the same
# checks a pull request must pass — there is no second, weaker definition to
# drift out of sync.
on:
  workflow_call:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Must track requires-python and the classifiers in pyproject.toml.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check import layering
        run: lint-imports

      # A gate, not a report. mypy found four user-visible defects the suite
      # could not: each lived on a path tests do not execute -- an interactive
      # terminal, a non-Linux OS, or a second implementation of an interface.
      - name: Type check
        run: mypy src/kitty

      - name: Test
        run: pytest -q

