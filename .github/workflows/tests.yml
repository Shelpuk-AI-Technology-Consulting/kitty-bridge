name: Tests

# Reusable test suite. Called by ci.yml (pushes and pull requests) and by
# publish.yml (tag pushes) so that a release is gated on exactly the same
# checks a pull request must pass — there is no second, weaker definition to
# drift out of sync.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    # A backstop, not a budget: the suite runs in a couple of minutes. Sized to
    # notice a hang. ⚠️ A matrix job is held to the LOWEST platform ceiling among
    # the labels its matrix can produce, so adding an `ubuntu-slim` entry here
    # would make this cap a fiction — see `.github/review/rules/ci.md`.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Must track requires-python and the classifiers in pyproject.toml.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check import layering
        run: lint-imports

      # A gate, not a report. mypy found four user-visible defects the suite
      # could not: each lived on a path tests do not execute -- an interactive
      # terminal, a non-Linux OS, or a second implementation of an interface.
      - name: Type check
        run: mypy src/kitty

      # The Fast gate: the L1 and L2 layers, named explicitly.
      #
      # 🔴 `--require-category` for EVERY layer the expression selects, and the
      # pairing is enforced by a test. `-m "l1 or l2"` is satisfied by `l1`
      # alone, so without these flags the job reports success for a layer it
      # never ran -- the same mistake an earlier draft of the design made when
      # it claimed an `or` expression would fail on an empty side. It will not.
      #
      # `--strict-markers` is on the command line, NOT in `addopts`: pytest 9.0
      # silently ignores it there and 9.1 does not, so a config-file placement
      # would mean the gate behaves differently on two contributors' machines.
      # `pyproject.toml` carries the reasoning in full.
      - name: Test
        run: >-
          pytest -m "l1 or l2" -q --strict-markers
          --require-category=l1 --require-category=l2

